<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>肌录 · final-2 原型（C 视觉 × 全功能 · 5 Tab × 13 页）</title>
<script src="assets/body-paths.js"></script>
<style>
/* ============ 基础与舞台 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:#1a1f2e;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.mono{font-family:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",Menlo,monospace}
.stage{display:flex;align-items:center;gap:20px}
.stage-note{font-size:11px;color:#8b99ae;letter-spacing:.5px;line-height:1.9;width:150px}
.phone{width:375px;height:812px;background:#000;border-radius:52px;padding:12px;flex:none;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 2px #333a4d,0 0 0 6px #14181f}
.phone::after{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:6px;border-radius:8px;background:#1c2130;z-index:60;pointer-events:none}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#0F172A;color:#F1F5F9}
@media (max-width:640px){body{overflow:auto}.phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none}.phone::after{display:none}.screen{border-radius:0}.stage-note{display:none}}
.page-scroll{position:absolute;top:0;left:0;right:0;bottom:60px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:20px}
.page-scroll::-webkit-scrollbar{display:none}
.debug-badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:70;font-size:11px;color:#8a93a8;
  background:rgba(100,116,139,.16);border:1px dashed rgba(148,163,184,.5);border-radius:8px;padding:4px 8px;letter-spacing:1px;
  pointer-events:none;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
/* ============ 肌录 design tokens v2（产品化调色：墨蓝底×熔岩橙，脱离 Tailwind 默认值；语义色纪律：橙红=品牌CTA专属 绿=完成态 紫=AI专属 红=危险 金=数字高亮） ============ */
:root{
  --bg:#0C1424; --card:#1B2540; --card2:#080E1C; --ink:#F2F6FC; --sub:#9AA8C0; --dim:#7C8BA1; --line:#2E3B58;
  --acc1:#F26A15; --acc2:#F0483E; --acc3:#FF6B8A; --ok:#34D17C; --warn:#FCA5A5; --gold:#FFBE85; --purple:#8B5CF6;
  --grad:linear-gradient(90deg,#F26A15,#F0483E); --gradV:linear-gradient(150deg,#F26A15 0%,#F0483E 70%,#E03375 120%);
  --r-lg:26px; --r-md:22px; --r-sm:16px; --r-xs:8px; --r-pill:999px;
  /* 字阶（9 档）：9 注释 / 10 眉题 / 11 辅助 / 12 正文 / 14 小标 / 16 数值 / 20 标题 / 26 页题 / 46 英雄数字 */
  /* 间距刻度：4 / 8 / 12 / 16 / 20 / 24 */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;
}
/* ============ 通用组件 ============ */
.card{margin:0 16px 14px;border-radius:var(--r-lg);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.sec-cap{font-size:10px;letter-spacing:2px;color:#FB923C;font-weight:700;margin:16px 16px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:8px 14px;font-size:11px;
  border:1px solid var(--line);color:var(--sub);cursor:pointer;user-select:none;background:transparent;white-space:nowrap}
.chip.on{background:var(--grad);border:none;color:#fff;font-weight:700}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;line-height:1.6;white-space:nowrap}
.badge.hl{background:rgba(242,106,21,.15);color:var(--gold);border:1px solid rgba(242,106,21,.4)}
.badge.plain{background:var(--card2);color:var(--sub);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:16px;
  padding:14px 16px;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(240,72,62,.35)}
.btn-ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.src{font-size:9px;color:var(--dim);line-height:1.7;margin:0 18px 6px;display:none}
body.notes .src{display:block}
/* 肌肉图色阶 ramp（全局唯一色阶语义：more accent = more training；openGym A2 吸收，color-mix 对 --acc1 派生，换主题自动跟随） */
.bm-sil{fill:rgba(154,168,192,.16)}
.bm-m{fill:rgba(154,168,192,.10)}
.bm-m.l1{fill:color-mix(in srgb,var(--acc1) 32%,#1B2540)}
.bm-m.l2{fill:color-mix(in srgb,var(--acc1) 56%,#1B2540)}
.bm-m.l3{fill:color-mix(in srgb,var(--acc1) 78%,#1B2540)}
.bm-m.l4{fill:var(--acc1)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
/* ============ 底部 5 Tab ============ */
#vnav{position:absolute;bottom:0;left:0;right:0;z-index:50}
.tabbar{display:flex;height:60px;align-items:stretch;background:rgba(11,17,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--dim);cursor:pointer}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.tb.on{color:#FDBA74}
.tb.on .ic-wrap{background:rgba(242,106,21,.14);border-radius:12px;padding:1px 10px}
/* ============ 页头 ============ */
.c-head{padding:54px 16px 10px}
.c-head .hi{font-size:12px;color:var(--gold);letter-spacing:2px}
.c-head h1{font-size:26px;font-weight:900;margin-top:4px;background:linear-gradient(90deg,#F97316,#FB7185);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-head .sub{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.7}
/* ============ P1 训练首页 ============ */
.hero{margin:0 16px 14px;border-radius:var(--r-lg);overflow:hidden;background:var(--gradV);border:none;color:#fff;padding:16px;position:relative}
.hero .tag{font-size:10px;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 10px;display:inline-block;letter-spacing:1px}
.hero h3{font-size:20px;font-weight:900;margin:10px 0 4px}
.hero .sub2{font-size:11px;opacity:.9}
.hero .stats{display:flex;gap:16px;margin:14px 0}
.hero .stats b{font-size:17px;display:block;font-family:ui-monospace,Consolas,monospace}
.hero .stats span{font-size:9px;opacity:.85}
.hero .go{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-size:14px;font-weight:900;letter-spacing:2px;color:#DC2626;background:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.streak{position:absolute;right:16px;top:16px;width:62px;height:62px;border-radius:50%;
  background:conic-gradient(#fff calc(2/14*360deg),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center}
.streak::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(0,0,0,.22)}
.streak div{position:relative;text-align:center;line-height:1.1;color:#fff}
.streak b{font-size:16px}.streak span{display:block;font-size:9px;opacity:.85}
.sugcard{margin:0 16px 14px;border-radius:var(--r-md);background:rgba(240,72,62,.1);border:1px solid rgba(240,72,62,.35);padding:12px 16px}
.sugcard .cap{font-size:10px;color:var(--gold);font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sugcard .cap i{width:6px;height:6px;border-radius:50%;background:var(--acc1);box-shadow:0 0 8px var(--acc1)}
.sug-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed rgba(148,163,184,.2)}
.sug-row .ex{font-size:13px;font-weight:700;width:110px}
.sug-row .delta{font-size:11px;color:var(--sub);flex:1;line-height:1.5}
.sug-row .delta b{color:var(--gold);font-family:ui-monospace,Consolas,monospace}
.adopt{font-size:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--sub);cursor:pointer;flex:none}
.adopt.ok{color:var(--ok);border-color:var(--ok)}
.exc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin:0 16px 12px;overflow:hidden}
.exc.done{border-color:rgba(34,197,94,.5);background:linear-gradient(160deg,rgba(34,197,94,.1),#16221b)}
.exc .hd{display:flex;align-items:center;gap:12px;padding:16px 16px;cursor:pointer}
.exc .idx{width:40px;height:40px;border-radius:16px;background:linear-gradient(140deg,#F97316,#FB7185);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;flex:none}
.exc h4{font-size:15px;font-weight:800}
.exc .rx{font-size:11px;color:var(--sub);margin-top:2px}
.exc .rx b{color:var(--gold);font-family:ui-monospace,Consolas,monospace}
.exc .pair{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(255,190,133,.14);color:var(--gold);border:1px solid rgba(255,190,133,.4);flex:none}
.exc .more{margin-left:auto;color:var(--dim);font-size:14px;transition:transform .3s}
.exc.open .more{transform:rotate(90deg)}
.excbody{max-height:0;overflow:hidden;transition:max-height .45s ease}
.exc.open .excbody{max-height:400px}
.excbody .in{padding:0 16px 14px;border-top:1px dashed var(--line);padding-top:11px}
.dots{display:flex;gap:7px;margin:8px 0 10px}
.dots i{flex:1;height:34px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.dots i.hit{background:var(--grad);border:none;color:#fff;font-weight:800}
.restcard{margin:0 16px 12px;border-radius:var(--r-md);background:radial-gradient(120% 140% at 20% 0%,rgba(242,106,21,.2),var(--card));border:1px solid rgba(242,106,21,.4);padding:14px;display:flex;align-items:center;gap:14px}
.restcard .ring{position:relative;width:60px;height:60px;flex:none}
.restcard .ring .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-family:ui-monospace,Consolas,monospace;color:var(--gold)}
.restcard b{font-size:13px;display:block}.restcard span{font-size:10px;color:var(--sub)}
.gobig{display:block;margin:2px 16px 10px;width:calc(100% - 32px);border:none;border-radius:16px;padding:16px;font-size:14px;font-weight:900;letter-spacing:2px;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 10px 24px rgba(240,72,62,.35)}
.weekdata{display:flex;align-items:flex-end;gap:7px;height:56px;padding:0 4px}
.weekdata i{flex:1;background:linear-gradient(to top,#4a2a17,var(--acc1));border-radius:4px 4px 0 0;opacity:.9}
.weekdata i.today{background:linear-gradient(to top,#0d3b33,var(--ok))}
.stat3{display:flex;gap:10px;margin:0 16px 14px}
.stat3 .s{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:center}
.stat3 b{font-size:16px;display:block;font-family:ui-monospace,Consolas,monospace}
.stat3 span{font-size:9px;color:var(--dim);letter-spacing:1px}
.stat3 .up{color:#4ADE80;font-size:9px}.stat3 .dn{color:#FCA5A5;font-size:9px}
/* ============ P2 动作列表 ============ */
.searchbar{margin:52px 16px 10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;color:var(--dim);font-size:13px;cursor:pointer}
.frow{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow .fl{font-size:10px;color:var(--dim);flex:none;margin-right:2px}
.exbig{margin:0 16px 12px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);padding:16px;cursor:pointer}
.exbig h4{font-size:16px;font-weight:800}
.exbig h4 span{font-size:10px;color:var(--dim);font-weight:400}
.exbig .meta{font-size:11px;color:var(--sub);margin:5px 0 10px}
.exbig .tagrow{display:flex;gap:6px;flex-wrap:wrap}
.count-note{font-size:10px;color:var(--dim);margin:0 18px 8px}
/* ============ P3 详情整页 ============ */
.dt-head{padding:54px 16px 14px;background:linear-gradient(180deg,#1e2b40,var(--bg))}
.dt-head h2{font-size:22px;font-weight:900}
.dt-head .en{font-size:11px;color:var(--sub);margin:4px 0 10px}
.dt-tags{display:flex;gap:6px;flex-wrap:wrap}
.dt-sec{margin:0 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.dt-sec h3{font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dt-sec h3::before{content:"";width:3px;height:12px;background:var(--grad);border-radius:8px}
.dt-sec ol{padding-left:20px}.dt-sec ol li{font-size:12px;line-height:1.85;color:#CBD5E1}
.dt-sec ul{list-style:none}.dt-sec ul li{font-size:12px;line-height:1.85;color:#CBD5E1;padding-left:14px;position:relative}
.dt-sec ul li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:1px;background:var(--acc1)}
.anat-tb{width:100%;border-collapse:collapse;font-size:11px}
.anat-tb th{color:var(--sub);font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-size:10px}
.anat-tb td{padding:7px 6px;border-bottom:1px solid #26324a;color:#CBD5E1;line-height:1.55}
.anat-tb td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.dt-danger{border-color:rgba(248,113,113,.4);background:linear-gradient(160deg,rgba(248,113,113,.08),#1a1416)}
.dt-danger h3{color:var(--warn)}.dt-danger h3::before{background:var(--warn)}.dt-danger li{color:#e8b4b4}
.dt-breath{background:linear-gradient(160deg,rgba(34,197,94,.08),#101614)}
.rr{display:flex;gap:8px}
.rr .cell{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.rr .cell b{display:block;font-size:14px;color:var(--gold);font-family:ui-monospace,Consolas,monospace}
.rr .cell span{font-size:9px;color:var(--dim)}
.linkrow{display:flex;flex-wrap:wrap;gap:6px}
.tier-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:52px 16px 0}
.tier-switch button{flex:1;border:none;background:transparent;font-size:12px;padding:8px 0;border-radius:12px;color:var(--sub);cursor:pointer;font-weight:600}
.tier-switch button.on{background:var(--grad);color:#fff;font-weight:800}
/* ============ P4/P5 拉伸 ============ */
.strow{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
.strow .tg{font-size:10px;color:#4ADE80}
.strow h4{font-size:13px;font-weight:700;margin:2px 0}
.strow .meta{font-size:10px;color:var(--sub)}
.strow .mth{margin-left:auto;font-size:9px;padding:3px 8px;border-radius:8px;background:rgba(34,197,94,.12);color:#4ADE80;flex:none}
.stepcard{margin:0 16px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:14px 16px;display:flex;gap:12px}
.stepcard .n{flex:none;width:26px;height:26px;border-radius:12px;background:linear-gradient(140deg,#F97316,#FB7185);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.stepcard p{font-size:13px;line-height:1.8;color:#CBD5E1}
/* 真实书页图占位块（仅原型内部评审用，产品内不使用——PRD 7.4） */
.imgblock{margin:0 16px 12px;border-radius:var(--r-md);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.imgblock img{width:100%;display:block}
.imgblock .cap{font-size:9px;color:var(--dim);padding:7px 12px;line-height:1.6;background:var(--card2)}
.imgblock .cap b{color:#c4b5fd}
/* ============ P6 执行页 ============ */
.run-top{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.96);backdrop-filter:blur(6px);padding:54px 16px 10px;border-bottom:1px solid var(--card);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--dim)}
.run-ex{margin:10px 16px 12px;border-radius:var(--r-md);background:linear-gradient(160deg,rgba(242,106,21,.14),var(--card));border:1px solid rgba(242,106,21,.4);padding:16px}
.run-ex .cat{font-size:9px;letter-spacing:2px;color:var(--acc1)}
.run-ex h2{font-size:20px;font-weight:900;margin:4px 0 2px}
.run-ex .en{font-size:10px;color:var(--sub)}
.run-ex .ref{font-size:11px;color:#c9d2e2;line-height:1.7;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(242,106,21,.3)}
.run-ex .ref b{color:var(--gold);font-family:ui-monospace,Consolas,monospace}
.setrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;margin:0 16px 8px;min-height:56px}
.setrow.warm{opacity:.62;border-style:dashed}
.setrow.cur{border-color:var(--acc1);background:linear-gradient(160deg,rgba(242,106,21,.12),var(--card));box-shadow:0 0 0 1px rgba(242,106,21,.35)}
.setrow .sn{font-size:11px;color:var(--dim);width:44px;flex:none;font-weight:700}
.setrow .sn .t{display:block;font-size:10px;color:var(--gold);font-weight:600}
.setrow input{width:56px;border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:16px;font-weight:700;text-align:center;color:var(--ink);font-family:ui-monospace,Consolas,monospace;background:var(--card2);flex:none}
.setrow .u{font-size:10px;color:var(--dim);flex:none}
.repbtns{display:flex;gap:3px;margin-left:auto}
.repbtns .rp{width:20px;height:24px;border-radius:8px;border:1px solid var(--line);color:#94a8c4;font-size:10px;background:var(--card2);cursor:pointer}
.repbtns .rp.hit{background:var(--grad);border:none;color:#fff;font-weight:800}
.failbtn{font-size:9px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim);cursor:pointer;flex:none}
.failbtn.on{color:var(--warn);border-color:var(--warn);background:rgba(248,113,113,.1)}
.rowmenu{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:16px;font-weight:900;cursor:pointer;flex:none;line-height:1}
.setdone{width:44px;height:44px;border-radius:50%;border:2px solid #3B4A66;background:transparent;color:#8fa0b8;font-size:18px;font-weight:900;cursor:pointer;flex:none;margin-left:auto}
.setrow .setdone{margin-left:0}

function runBind(){
  /* ± 步进已删（v3 简化）：点数字直接输入；改重量确认 → 作用域 sheet（v1.7.3） */
  document.querySelectorAll('.setrow input[inputmode="decimal"]').forEach(inp=>{
    inp.onchange=()=>showScopeSheet(inp.value);
  });
  /* 计时（打勾即弹，startRest 统一入口） */
  const total=180;let left=total,run=false;
  const num=$('rNum');
  const draw=()=>{if(num)num.textContent=left;};
  const start=()=>{stopTimer();run=true;draw();
    timerInt=setInterval(()=>{left--;draw();
      if(left<=0){stopTimer();run=false;left=total;draw();}},1000);};
  const startRest=()=>{restOn=true;const box=$('restBox');box.style.display='block';
    box.scrollIntoView({behavior:'smooth',block:'center'});
    left=total;start();showPRToast();};
  window.startRest=startRest;
  /* 组完成打勾 → 即弹计时（兑现 PRD 5.10.3 承诺） */
  document.querySelectorAll('[data-setdone]').forEach(b=>{
    b.onclick=()=>{const on=b.dataset.setdone==='0';
      b.dataset.setdone=on?'1':'0';
      b.style.borderColor=on?'var(--ok)':'#3B4A66';
      b.style.background=on?'var(--ok)':'transparent';
      b.style.color=on?'#04220f':'#8fa0b8';
      b.textContent=on?'✓':'';
      if(on)startRest();};});
  /* 组选项 ⋯（失败标记移入此处，防汗手误触——评审 P0 修复） */
  document.querySelectorAll('[data-rowmenu]').forEach(b=>{
    b.onclick=()=>openRowMenu(b);});
  if($('rGo'))$('rGo').onclick=()=>{run?stopTimer()&&0:start();run=!run;};
  if($('rSkip'))$('rSkip').onclick=e=>{e.stopPropagation();stopTimer();run=false;left=total;draw();};
  if($('rAdj'))$('rAdj').onclick=()=>{left+=30;draw();};
  if($('logSet'))$('logSet').onclick=()=>startRest();
  if($('openSheet'))$('openSheet').onclick=()=>openSheet();
  if($('openSwap'))$('openSwap').onclick=()=>openSwap();
  if($('openHist'))$('openHist').onclick=()=>openHist();
  if($('endBtn'))$('endBtn').onclick=()=>endTraining();
}

/* ============ 肌肉图组件 v2（MuscleMap 真解剖几何 18 肌×正背，MIT·Melih Colpan；色阶 l0-l4 全局 ramp；openGym A1/A2 吸收） ============ */
function bodyMap(frontHi, backHi, labels){
  const D=window.BODY_PATHS;
  if(!D){return `<div style="padding:30px;text-align:center;font-size:10px;color:var(--dim)">几何资产未加载（assets/body-paths.js）</div>`;}
  const LV=v=>v>=1?4:v>=.66?3:v>=.33?2:v>0?1:0;
  const view=(v,hi)=>{
    const vset=D.male[v], P=vset.p;
    const INERTS=window.MUSCLES_INERT.map(s=>(P[s]||[]).map(d=>`<path class="bm-sil" d="${d}"/>`).join('')).join('');
    const MUS=window.MUSCLES_18.map(s=>{const lv=LV(hi[s]||0);
      return (P[s]||[]).map(d=>`<path class="bm-m l${lv}" d="${d}"/>`).join('');}).join('');
    return `<svg viewBox="${vset.vb}" style="width:100%" preserveAspectRatio="xMidYMid meet">
      <g stroke="var(--card)" stroke-width="3" stroke-linejoin="round">${INERTS}${MUS}</g></svg>`;
  };
  return `<div style="display:flex;gap:8px;align-items:flex-start">
    <div style="flex:1">${view('front',frontHi)}${labels?`<div style="text-align:center;font-size:10px;color:var(--dim);margin-top:4px">${labels[0]}</div>`:''}</div>
    <div style="flex:1">${view('back',backHi)}${labels?`<div style="text-align:center;font-size:10px;color:var(--dim);margin-top:4px">${labels[1]}</div>`:''}</div>
  </div>`;
}

  const path=pts.map((p,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' ');
  const area=path+` L${xs(pts.length-1)},${H-P} L${xs(0)},${H-P} Z`;
  return `
  <div class="c-head">
    <div class="hi">动作趋势 · 高杆位杠铃深蹲 EX_1436</div>

  <div class="card" style="padding:6px 16px">
    ${[['09-06','50kg×5×5','全完成 → 建议下次 +2.5'],['09-02','50kg×5×5','首次破 50 🏁'],['08-29','47.5kg×5×5','全完成'],['08-26','47.5kg×5×4,4','末组失败@4 → 标记']].map(r=>`

function meBind(){
  const calc=()=>{
    const w=parseFloat($('cw').value),r=parseInt($('cr').value,10);
    if(!(w>0&&r>0))return;
    const orm=w*(1+r/30);
    $('cout').textContent=orm.toFixed(1)+' kg';
    [['c95',.95],['c90',.90],['c80',.80],['c70',.70]].forEach(([id,f])=>{$(id).textContent=(orm*f).toFixed(1);});
  };
  if($('cw')){$('cw').oninput=calc;$('cr').oninput=calc;}
  document.querySelectorAll('#dbChips .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  if($('pw')){$('pw').oninput=()=>{
    const target=parseFloat($('pw').value);
    const box=$('plates');box.innerHTML='';
    if(!(target>=25)){return;}
    let per=(target-20)/2; /* 每侧 */
    const den=[25,20,15,10,5,2.5,1.25];
    const colors={25:'#EF4444',20:'#3B82F6',15:'#FDF2E9',10:'#22C55E',5:'#FDF2E9',2.5:'#94A3B8',1.25:'#94A3B8'};
    let out=[];
    den.forEach(d=>{while(per>=d-0.01){out.push(d);per=+(per-d).toFixed(2);}});
    out.slice(0,12).forEach(d=>{
      const i=document.createElement('i');
      i.style.borderColor=colors[d];i.style.color=d===15||d===5?'#111':'#fff';
      i.textContent=d;box.appendChild(i);});
    $('pnote').textContent=`每侧 ${out.join(' + ')} kg（${out.length} 片/侧）`;
  };}
}

  <div style="position:sticky;bottom:64px;background:var(--bg);border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center">

  </div>`
  :`

    <div class="grow" style="background:var(--card2);border-radius:4px 14px 14px 14px;padding:8px 12px">帮我安排一个 12 周的增肌计划，家里只有一对哑铃</div></div>
    <div style="display:flex;gap:8px;margin-bottom:10px"><span style="flex:none;width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#8B5CF6,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:12px">🤖</span>
    <div class="grow" style="background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:4px 14px 14px 14px;padding:8px 12px">
      信息充分度 <b>ask</b>（还差 1 个会改变结构的问题）：<b>每周能练几天？</b>
      <div style="font-size:10px;color:var(--dim);margin-top:4px">非关键缺口采用保守假设并明示，不把普通请求变成长问卷</div></div></div>
    <div style="display:flex;gap:8px;margin-bottom:10px"><span style="flex:none;width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px">🧑</span>
    <div class="grow" style="background:var(--card2);border-radius:4px 14px 14px 14px;padding:8px 12px">3 天</div></div>
  </div>
  <div class="sugcard" style="background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.4)">
    <div class="cap" style="color:#c4b5fd"><i style="background:#8B5CF6;box-shadow:0 0 8px #8B5CF6"></i>生成计划卡（规则定骨架 · LLM 只在约束空间内适配）</div>

  </div>

  <div style="height:8px"></div>`;

function aiBind(){
  document.querySelectorAll('[data-aitab]').forEach(b=>{b.onclick=()=>{aiTab=b.dataset.aitab;render();};});
  document.querySelectorAll('[data-aicat]').forEach(c=>{c.onclick=()=>{aiCat=c.dataset.aicat;render();};});
  document.querySelectorAll('[data-ai-save]').forEach(b=>{b.onclick=()=>{
    const t=document.createElement('div');t.dataset.overlay='1';
    t.innerHTML=`<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:62;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;padding:14px 22px;border-radius:16px">已存入我的${b.dataset.aiSave} ✓（演示）</div>`;
    $('screen').appendChild(t);setTimeout(()=>t.remove(),1500);};});
  /* 预设问题 chip：填入输入框并发送 */
  document.querySelectorAll('[data-aiq]').forEach(c=>{c.onclick=()=>{if($('aiInput')){$('aiInput').value=c.dataset.aiq;sendAI();}};});
  const bubble=(who,html)=>`
  <div style="display:flex;gap:8px;margin:0 14px 10px"><span style="flex:none;width:26px;height:26px;border-radius:8px;${who==='me'?'background:var(--card2)':'background:linear-gradient(140deg,#8B5CF6,#0EA5E9)'};display:flex;align-items:center;justify-content:center;font-size:12px">${who==='me'?'🧑':'🤖'}</span>
  <div class="grow" style="${who==='me'?'background:var(--card2);border-radius:4px 14px 14px 14px':'background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:4px 14px 14px 14px'};padding:10px 12px;font-size:12px;line-height:1.8">${html}</div></div>`;
  window.sendAI=()=>{
    const inp=$('aiInput'),box=$('aiDialog');if(!inp||!box||!inp.value.trim())return;
    const q=inp.value.trim();inp.value='';
    const hit=/膝盖|脚尖/.test(q)?FAQS[0]:/休息|组间/.test(q)?FAQS[1]:/发力|练背|背/.test(q)?FAQS[2]:null;
    box.innerHTML=bubble('me',q)+bubble('ai',hit
      ?`<b>${hit.a}</b><br><span style="color:var(--sub);font-size:11px">依据：${hit.why.split('；')[0]}…</span><br><span style="font-size:10px;color:#FDBA74">${hit.ev.map(e=>'['+e[0]+']').join(' ')} ${hit.src}</span><br><span style="font-size:10px;color:#7DD3FC">↑ 完整四段回答见下方问答库（已命中预设库 · 离线）</span>`
      :`<b style="color:var(--warn)">当前知识库没有足够依据回答这个问题。</b><br><span style="color:var(--sub);font-size:11px">首批=离线问答库匹配（拒答不编造）；二批云函数解锁 RAG 检索自由提问。试试：膝盖超脚尖？/ 组间休息多久？</span>`);
    box.scrollIntoView({behavior:'smooth',block:'center'});};
  if($('aiSend'))$('aiSend').onclick=()=>sendAI();
  if($('aiInput'))$('aiInput').onkeydown=e=>{if(e.key==='Enter')sendAI();};
}
